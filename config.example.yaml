# Example configs for `uv run python run.py <this-file>.yaml`
# Paths in cr_xml are relative to this YAML file's directory.

# Cropped Frankfurt example (random traffic on that map): config.frankfurt_shorter.yaml

# --- Prepackaged CommonRoad + SUMO folder (bundled *.sumo.cfg next to XML) ---
scenario:
  kind: folder
  cr_xml: path/to/scenario.cr.xml
  patch_incoming: true   # rewrite duplicate incoming IDs to a .patched.xml copy

sumo:
  mode: bundled # bundled | random
  steps: 300
  # random-only (ignored for bundled): random_density_scale (default 1), random_seed, random_map_matching_delta

# Each run writes under: output.dir / [output.group /] {name}_{steps}steps_{YYYYMMDD_HHMMSS} /
#  - name: output.name, else output.subfolder, else scenario_id (folder) or "synthetic_sweep"
#  - Turn off timestamp or steps in the folder name if you need stable paths.
output:
  dir: outputs/run
  group: null            # optional: nest runs under this subfolder of dir (e.g. "Frankfurt_batch")
  name: null             # optional: override the base name in the run folder (else subfolder or scenario id)
  subfolder: null        # legacy alias for name when name is unset
  clean: false
  timestamp_folder: true
  include_steps_in_folder_name: true

plot:
  figsize_in: [16.0, 6.0]
  dpi: 150
  vertical_scale: 10.0
  view_fraction: 0.35    # central fraction of lanelet bbox; null = full map
  gif_target_frames: 72
  gif_fps: 12.0
  gif_dpi: 85

artifacts:
  lanes_png: true
  three_times_png: true
  gif: true

metrics:
  enabled: true
  csv_name: metrics.csv
  plot_name: metrics.png
  aggregate_synthetic: true
  aggregate_plot_name: accident_metrics_vs_curvature.png
  aggregate_csv_name: curvature_sweep_metrics.csv

