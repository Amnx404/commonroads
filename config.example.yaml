# Example config: copy and set scenario.cr_xml (path relative to this file).

scenario:
  kind: folder
  cr_xml: path/to/scenario.cr.xml
  patch_incoming: true

sumo:
  mode: bundled   # bundled | random
  steps: 300
  # random-only: random_density_scale (>1 = denser), random_seed, random_map_matching_delta

output:
  dir: outputs/run
  group: null
  name: null
  subfolder: null
  clean: false
  timestamp_folder: true
  include_steps_in_folder_name: true

plot:
  figsize_in: [16.0, 6.0]
  dpi: 150
  vertical_scale: 10.0
  view_fraction: 0.35
  gif_target_frames: 72
  gif_fps: 12.0
  gif_dpi: 85

artifacts:
  lanes_png: true
  three_times_png: true
  gif: true

metrics:
  enabled: true
  csv_name: metrics.csv
  plot_name: metrics.png
